name: Test, build and deploy bento-web

# Branch-routed pipeline, like bento-crm:
#   push to main -> production (bento212.com/blog, /srv/bento/apps/bento-web,     :<sha> + :latest)
#   push to dev  -> dev        (dev.bento212.com,  /srv/bento/apps/bento-web-dev, :dev-<sha> + :dev)
on:
  push:
    branches: [main, dev]
  workflow_dispatch: {}

concurrency:
  group: deploy-bento-web-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/bento-web

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      app_dir: ${{ steps.resolve.outputs.app_dir }}
      compose_file: ${{ steps.resolve.outputs.compose_file }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        run: |
          SHA="${GITHUB_SHA::12}"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            {
              echo "tag=$SHA"
              echo "moving=latest"
              echo "app_dir=/srv/bento/apps/bento-web"
              echo "compose_file=docker-compose.yml"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tag=dev-$SHA"
              echo "moving=dev"
              echo "app_dir=/srv/bento/apps/bento-web-dev"
              echo "compose_file=docker-compose.dev.yml"
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.resolve.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.resolve.outputs.moving }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The exact image about to ship: boot, migrations, host split, first-admin gate, publishing and
  # scheduled publishing. A failure here stops the deploy.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: ops/smoke-test.sh "${{ env.IMAGE }}:${{ needs.build.outputs.tag }}"

  deploy:
    needs: [build, smoke]
    # Off until the server is prepared (see README). Set the repo variable DEPLOY_ENABLED to true.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Pin host key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy new image to host
        run: |
          ssh "${{ secrets.DEPLOY_SSH_HOST }}" \
            "GHCR_LOGIN_USER='${{ github.actor }}' GHCR_LOGIN_TOKEN='${{ secrets.GITHUB_TOKEN }}' DEPLOY_COMPOSE_FILE='${{ needs.build.outputs.compose_file }}' ${{ needs.build.outputs.app_dir }}/deploy.sh ${{ needs.build.outputs.tag }}"
